# The PR agent: watches every pull request, opens one for every branch that has none ("Compare & pull request"),
# merges every pull request whose checks are green, and has Claude fix the ones with red checks or a merge conflict.
# The planning is .github/scripts/pr-agent.mjs; the fixing is the "fix" job below.
#
# It runs every 30 minutes as well as after every Checks run and every branch push, and keeps nothing between runs
# except labels and comments on GitHub. So when Claude's credits or usage limit run out, the fix job labels the pull
# request agent:waiting-credits without using up a try, and the next run after they are replenished carries on by
# itself — nothing to restart.
#
# Setup (Settings → Secrets and variables → Actions):
#   - CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, uses a Claude subscription) or ANTHROPIC_API_KEY.
#   - PR_AGENT_TOKEN: a fine-grained personal access token for this repository with Contents, Pull requests,
#     Issues and Workflows: Read and write. Without it the agent uses the workflow's own token, and GitHub then
#     does not run Checks on the pull requests it opens or the fixes it pushes, nor R2 documents on its merges.
#   - Optional variables: PR_AGENT_ENABLED=false (stops it), PR_AGENT_MERGE_METHOD (squash | merge | rebase),
#     PR_AGENT_BRANCH_MAX_AGE_DAYS (14), PR_AGENT_MAX_FIX_ATTEMPTS (3), PR_AGENT_SKIP_BRANCHES (a regex).
# A pull request labelled agent:skip, or a draft, is left alone.
name: PR agent

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:
    workflows: [Checks]
    types: [completed]
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print what it would do'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read
  id-token: write

concurrency:
  group: pr-agent
  cancel-in-progress: false

jobs:
  plan:
    name: Open, merge and triage pull requests
    if: vars.PR_AGENT_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      fix: ${{ steps.plan.outputs.fix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ secrets.PR_AGENT_TOKEN || github.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          PR_AGENT_MERGE_METHOD: ${{ vars.PR_AGENT_MERGE_METHOD }}
          PR_AGENT_BRANCH_MAX_AGE_DAYS: ${{ vars.PR_AGENT_BRANCH_MAX_AGE_DAYS }}
          PR_AGENT_MAX_FIX_ATTEMPTS: ${{ vars.PR_AGENT_MAX_FIX_ATTEMPTS }}
          PR_AGENT_SKIP_BRANCHES: ${{ vars.PR_AGENT_SKIP_BRANCHES }}
        # (main runs it, so a branch can't change what the agent does; until it is merged there, there is nothing to run)
        run: |
          if [ ! -f .github/scripts/pr-agent.mjs ]; then echo "::notice::The PR agent isn't on the default branch yet"; exit 0; fi
          node .github/scripts/pr-agent.mjs

  fix:
    name: 'Fix #${{ matrix.pr.number }}'
    needs: plan
    if: needs.plan.outputs.fix != '' && needs.plan.outputs.fix != '[]' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pr: ${{ fromJSON(needs.plan.outputs.fix) }}
    env:
      GH_TOKEN: ${{ secrets.PR_AGENT_TOKEN || github.token }}
      PR: ${{ matrix.pr.number }}
      BRANCH: ${{ matrix.pr.branch }}
      SHA: ${{ matrix.pr.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.pr.branch }}
          fetch-depth: 0
          token: ${{ secrets.PR_AGENT_TOKEN || github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Git identity
        run: |
          git config user.name "PR agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Claude fixes the pull request
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.PR_AGENT_TOKEN || github.token }}
          claude_args: '--max-turns 80 --allowedTools "Bash,Read,Edit,Write,Glob,Grep"'
          prompt: |
            You are fixing pull request #${{ matrix.pr.number }} ("${{ matrix.pr.title }}") in ${{ github.repository }}.
            Its branch `${{ matrix.pr.branch }}` is checked out at ${{ matrix.pr.sha }}. What is wrong: ${{ matrix.pr.reasons }}.

            1. If there is a merge conflict: `git fetch origin ${{ github.event.repository.default_branch || 'main' }}` and
               `git merge origin/${{ github.event.repository.default_branch || 'main' }}`, then resolve every conflict keeping
               the intent of both sides. Never rebase or force-push.
            2. For each failing check, read its log: `gh pr checks ${{ matrix.pr.number }}` lists them, and
               `gh run view <run id> --log-failed` shows what failed. Reproduce it locally with the same command
               (.github/workflows/checks.yml lists them; the smoke tests are in .github/scripts/smoke.mjs), find the
               root cause and make the smallest fix. Follow README.md and the code around you.
            3. Never skip, disable or weaken a test or check to make it pass. If the failure is not caused by this
               pull request, or you cannot fix it, change nothing and say why.
            4. Re-run the checks you touched until they pass, then commit with a clear message and
               `git push origin HEAD:${{ matrix.pr.branch }}`.
            End with a short summary of what was wrong and what you changed.
      - name: Record the outcome
        if: always()
        env:
          OUTCOME: ${{ steps.claude.outcome }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASONS: ${{ matrix.pr.reasons }}
          # Keep in sync with ATTEMPT_MARK in .github/scripts/pr-agent.mjs
          ATTEMPT_MARK: '<!-- pr-agent:attempt'
        run: |
          # Out of credits / usage limit / rate limited: no try is used up, and the next scheduled run retries
          if [ "$OUTCOME" != "success" ] && { [ -z "$EXEC" ] || [ ! -f "$EXEC" ] || grep -qiE 'credit balance is too low|usage limit|rate[_ ]limit|overloaded_error|insufficient[_ ]quota|out of (credits|extra usage)' "$EXEC"; }; then
            echo "Claude could not run (credits, usage limit or rate limit) — the next run retries automatically."
            gh pr edit "$PR" --add-label agent:waiting-credits || true
            exit 0
          fi
          gh pr edit "$PR" --remove-label agent:waiting-credits 2>/dev/null || true
          git fetch -q origin "$BRANCH"
          NEW=$(git rev-parse "origin/$BRANCH")
          if [ "$NEW" != "$SHA" ]; then RESULT="pushed ${NEW:0:7}; checks will run on it and it merges once they are green"
          else RESULT="Claude made no change (see the run log for why)"; fi
          SUMMARY=""
          if [ -f "$EXEC" ]; then
            SUMMARY=$(jq -r '[.[] | select(.type == "result") | .result // empty] | last // empty' "$EXEC" 2>/dev/null | head -c 3000)
          fi
          printf '%s\n' "$ATTEMPT_MARK sha=$SHA -->" "🤖 **PR agent** tried to fix ${SHA:0:7} ($REASONS): $RESULT. [Run log]($RUN_URL)" "" "$SUMMARY" > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
        shell: bash
