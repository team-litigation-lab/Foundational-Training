# Uploads the document folders to Cloudflare R2 (bucket lshtraining, under courses/ft/), where worker.js
# serves them from (docFromR2). On a push to main only the files that changed are uploaded or deleted;
# "Run workflow" (Actions tab) uploads every file. Until a file is in R2 the Worker serves it from its
# static assets, so nothing breaks if this hasn't run.
# Setup: the repository secret CLOUDFLARE_API_TOKEN (a token with "Workers R2 Storage: Edit"). Until it's
# set, the run just prints a notice.
name: R2 documents

on:
  push:
    branches: [main]
    paths:
      - 'ft/**'
      - 'trainer/**'
      - '.github/workflows/r2-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-docs
  cancel-in-progress: false

jobs:
  upload:
    name: Upload documents to R2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a5bc4befef0191374735bd6a0109fec0
      BUCKET: lshtraining
      PREFIX: courses/ft
      DIRS: ft trainer
    steps:
      - name: Check the Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN isn't set, so no documents were uploaded (the Worker keeps serving them from its static assets)."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.token.outputs.skip != '1'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        if: steps.token.outputs.skip != '1'
        with:
          node-version: 22
      - name: Upload changed documents, remove deleted ones
        if: steps.token.outputs.skip != '1'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          npm install -g wrangler@4 > /dev/null
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git -c core.quotePath=false diff --no-renames --name-status "$BEFORE" HEAD -- $DIRS > "$RUNNER_TEMP/changes"
          else
            git -c core.quotePath=false ls-files -- $DIRS | sed 's/^/A\t/' > "$RUNNER_TEMP/changes"   # every file
          fi
          echo "$(grep -c . "$RUNNER_TEMP/changes" || true) change(s) under: $DIRS"
          node .github/scripts/r2-sync.mjs "$RUNNER_TEMP/changes"
