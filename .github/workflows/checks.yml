# Runs on every pull request and every push to main. A failure shows as a red
# "Checks" status on the PR/commit with a readable log, and GitHub emails the
# person who pushed. Nothing here deploys.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Syntax, files and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # (js/ft-day-decks-data.js isn't committed: it is built here, as wrangler.json's "build" builds it on deploy)
      - name: Build the Day decks' slides (build/day-decks.cjs → js/ft-day-decks-data.js)
        run: node build/day-decks.cjs
      - name: JavaScript syntax, local files, JSON
        run: node .github/scripts/check-site.mjs
      - name: Batch IDs are B + MMDDYY (the page and the Worker read them the same way; older codes keep working)
        run: node .github/scripts/batch-id.cjs
      - name: Single sign-on (the Portal is the only way a trainee gets in; a missing PORTAL_SSO_SECRET says so)
        run: node .github/scripts/sso.cjs
      - name: The Gemini key pool (a key out of credits, with billing off, rejected or busy hands over to the next key)
        run: node .github/scripts/gemini-keys.mjs
      - name: Documents served from R2 (ranges, 304s, static assets as the fallback)
        run: node .github/scripts/r2-docs.mjs
      - name: The tracker and the Monitoring Sheet in Google Drive (read, checked, the trainer's input kept)
        run: node .github/scripts/drive.cjs
      - name: Attorney Calendar Management Activity simulator, graded through the Calendar Activity Check (a perfect calendar from its key scores 100, mistakes caught as the Check marks them, the Standard weeks unchanged)
        run: node .github/scripts/calsim-activity.cjs
      - name: Build the Worker without deploying (wrangler dry run)
        run: npx --yes wrangler@4 deploy --dry-run --outdir "$RUNNER_TEMP/dist"

  smoke:
    name: Server requests in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the Day decks' slides (build/day-decks.cjs → js/ft-day-decks-data.js)
        run: node build/day-decks.cjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1 jspdf@4.2.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      # 🎯 on a pull request, only the browser tests its change can affect (.github/scripts/affected.mjs: the tests that drive
      # what the changed files define, use or patch, and always the server requests test); every test on a push to main,
      # on Run workflow, and when the change touches what every page shares. They run 3 at a time, each on its own test
      # server (.github/scripts/smoke.mjs)
      - name: Pick the browser tests this change affects
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node .github/scripts/affected.mjs --why "${{ github.event.pull_request.base.sha }}"
            echo "tests=$(node .github/scripts/affected.mjs "${{ github.event.pull_request.base.sha }}" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          else
            echo "ALL (a push to main, or Run workflow)"; echo "tests=ALL" >> "$GITHUB_OUTPUT"
          fi
      - name: Run them (each on its own test server, 3 at a time)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          SMOKE_JOBS: 3
        run: node .github/scripts/smoke.mjs ${{ steps.pick.outputs.tests }}
