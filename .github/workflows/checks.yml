# Runs on every pull request and every push to main. A failure shows as a red
# "Checks" status on the PR/commit with a readable log, and GitHub emails the
# person who pushed. Nothing here deploys.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Syntax, files and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: JavaScript syntax, local files, JSON
        run: node .github/scripts/check-site.mjs
      - name: Batch IDs are B + MMDDYY (the page and the Worker read them the same way; older codes keep working)
        run: node .github/scripts/batch-id.cjs
      - name: Single sign-on (the Portal is the only way a trainee gets in; a missing PORTAL_SSO_SECRET says so)
        run: node .github/scripts/sso.cjs
      - name: The Gemini key pool (a key out of credits, with billing off, rejected or busy hands over to the next key)
        run: node .github/scripts/gemini-keys.mjs
      - name: Documents served from R2 (ranges, 304s, static assets as the fallback)
        run: node .github/scripts/r2-docs.mjs
      - name: The tracker and the Monitoring Sheet in Google Drive (read, checked, the trainer's input kept)
        run: node .github/scripts/drive.cjs
      - name: Build the Worker without deploying (wrangler dry run)
        run: npx --yes wrangler@4 deploy --dry-run --outdir "$RUNNER_TEMP/dist"

  smoke:
    name: Server requests in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1 jspdf@4.2.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Server requests (sparing, batched, none in the background)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          node .github/scripts/server.mjs 8787 > "$RUNNER_TEMP/server.log" 2>&1 &
          sleep 2
          node .github/scripts/requests.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Graded calls count in their lesson (the Modules stat row, its lesson rows, the mock-call cards)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/graded-calls.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Blueprints (the Trainer blueprint and its PDF; the Trainee blueprint republished after every deploy)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/blueprint.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Day decks (one per day, nothing facilitator-only, no Process Questions; opened from the Dashboard band)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/day-decks.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Transcription Activity (Day 9's minutes, end to end; the trainer's view)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/transcribe.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Video Notes and Process Guide (what was learned from each video; the Word-like guide before each demo)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/guide-notes.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Practice Sessions (firms and case assignment, the sessions' checks, the trainer's review and inputs, the Scorecard)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/practice-sessions.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Weekly Ranking Report (the facilitator's format, marks out of 5, the final average and the ranking, the Word file)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/ranking.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Trainer feedback (Send Feedback, the trainee's card, My Feedback, the scorecards and the Weekly Ranking in My Performance)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/feedback.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Typing & Spelling Tests (the append-only log, both tests, make-ups, the trainer's grid and compliance line, the Weekly Ranking's column)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/skilltests.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Naming & Reporting Drills (every question against its convention, the guide's samples, a round saved)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/drills.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Case Assignment (nothing handed out on its own; the trainer assigns the firm and the cases, the trainee only reads them)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/assign.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Open days (every day card and deck open to a trainee; the lessons wait on the trainer's 📅 Open Lessons)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/gating.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Knowledge Games (the bank for every lesson, Survey Says matching, all eight games played to the end and saved, the trainer's questions, the worker's rules)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/kcgames.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Calendar Mock Call Booking Rule Check (every scheduling rule, a booking recorded and saved, the trainer's tab and scorecard fill, the worker's rules)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/calrules.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Call Listening Log (the four sets, a part-filled and a full log, the trainer's reading and set editing, the worker's rules)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/listening.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Shadowing log and the day's To-Do (the guide's wording, the Practice Lab's To-Do, a logged session, the trainer's buddy and reading)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/shadowing.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
