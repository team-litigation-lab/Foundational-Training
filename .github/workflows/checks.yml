# Runs on every pull request and every push to main. A failure shows as a red
# "Checks" status on the PR/commit with a readable log, and GitHub emails the
# person who pushed. Nothing here deploys.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Syntax, files and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # (js/ft-day-decks-data.js isn't committed: it is built here, as wrangler.json's "build" builds it on deploy)
      - name: Build the Day decks' slides (build/day-decks.cjs → js/ft-day-decks-data.js)
        run: node build/day-decks.cjs
      - name: Every script's version and APP_BUILD follow their content (build/script-versions.cjs, run at every deploy)
        run: node build/script-versions.cjs --check
      - name: JavaScript syntax, local files, JSON
        run: node .github/scripts/check-site.mjs
      - name: Pull requests kept up to date after a deploy (only safe conflicts resolved; a result that fails a check, or a conflict that needs a person, is never pushed)
        run: node .github/scripts/pr-auto-update-test.cjs
      - name: No builder notes on the site (the Training Guide's instructions for building the platform aren't content)
        run: node .github/scripts/builder-notes.cjs
      - name: Batch IDs are B + MMDDYY (the page and the Worker read them the same way; older codes keep working)
        run: node .github/scripts/batch-id.cjs
      - name: Single sign-on (the Portal is the only way a trainee gets in; a missing PORTAL_SSO_SECRET says so)
        run: node .github/scripts/sso.cjs
      - name: The Gemini key pool (a key out of credits, with billing off, rejected or busy hands over to the next key)
        run: node .github/scripts/gemini-keys.mjs
      - name: Claude as the primary AI provider (ANTHROPIC_API_KEY; Haiku for chat, Sonnet for grading; the Gemini pool takes over when Claude can't answer)
        run: node .github/scripts/claude-primary.mjs
      - name: Documents served from R2 (ranges, 304s, static assets as the fallback)
        run: node .github/scripts/r2-docs.mjs
      - name: The tracker and the Monitoring Sheet in Google Drive (read, checked, the trainer's input kept)
        run: node .github/scripts/drive.cjs
      - name: A batch's Drive files linked by their naming convention, and each trainee backtracked from Day 1 (worker.js autoLinkBatch, backtrack)
        run: node .github/scripts/autolink.cjs
      - name: The TAM's day entries — a time or a length ("1.5 hours", "at 10.30") isn't a date heading (worker.js tamEntries)
        run: node .github/scripts/tam-dates.cjs
      - name: The glossary's search highlighting never lands inside an escaped character (a quote or an "&" stays itself; glossary.html hl)
        run: node .github/scripts/glossary-hl.cjs
      - name: A day's compliance counts from the batch's first day, a passing Drive fault isn't a 0, and a B + DDMMYY Batch ID starts on its day (worker.js dailyCompliance)
        run: node .github/scripts/compliance-start.cjs
      - name: A day checked before its work came in is worked out again once over, raised and never lowered
        run: node .github/scripts/compliance-recheck.cjs
      - name: The Day's outputs with the scores of what was graded that day (worker.js dailyCompliance graded)
        run: node .github/scripts/outputs-scores.cjs
      - name: The nightly check lists each trainee's folder once a run, and one unreadable trainee doesn't stop the rest (worker.js runTrackerChecks)
        run: node .github/scripts/cron-checks.cjs
      - name: Calendar Management Mock Call scorecard, one with the Portal's Google Calendar Simulator
        run: node .github/scripts/calsim-card.cjs
      - name: A Monitoring Sheet kept as a Word file (.docx) in Drive read and checked
        run: node .github/scripts/monitor-docx.cjs
      - name: Grading a long answer sheet (in batches; a cut-off AI reply, no AI at all, never a ✗ for a right answer)
        run: node .github/scripts/assess-grade.cjs
      - name: The Transcription Activity's automatic score (the shared checks and one AI call, clamped to half points; cached, throttled and capped for a trainee; without the AI the trainer scores the rest)
        run: node .github/scripts/transcribe-grade.cjs
      - name: Day 8's Intake Packet checked (the corrected packet and its client subfolder; missing, misidentified and misnamed documents)
        run: node .github/scripts/intake-packet.cjs
      - name: Who sees what of the Batch Sheet and My Progress (a trainee only their own; only a trainer moves a batch)
        run: node .github/scripts/sheet-access.cjs
      - name: A duplicate account merges into the one kept (everything moves, the faulty one is deleted, its sign-in opens the kept one)
        run: node .github/scripts/merge-accounts.cjs
      - name: Inactive accounts are swept with a backup first, never an active trainee or a cleared batch's kept record
        run: node .github/scripts/sweep.cjs
      - name: Clearing a batch's trainee keeps their record first (archived, with the scorecard, a long one shortened to valid JSON), then clears the rest
        run: node .github/scripts/batch-purge.cjs
      - name: A Knowledge Check is taken once (a second attempt isn't saved; a trainer's retry lets one more through)
        run: node .github/scripts/kc-once.cjs
      - name: The six Drive links are the trainee's own, named by their rules (the template, another batch's or trainee's, the same file twice are caught)
        run: node .github/scripts/drive-own.cjs
      - name: GDRIVE_SA_KEY signs in however it was pasted (the PEM, with its quotes, the whole JSON file), or says what is wrong
        run: node .github/scripts/drive-key.cjs
      - name: Attorney Calendar Management Activity simulator, graded through the Calendar Activity Check (a perfect calendar from its key scores 100, mistakes caught as the Check marks them, the Standard weeks unchanged)
        run: node .github/scripts/calsim-activity.cjs
      - name: Build the Worker without deploying (wrangler dry run)
        run: npx --yes wrangler@4 deploy --dry-run --outdir "$RUNNER_TEMP/dist"

  smoke:
    name: Server requests in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the Day decks' slides (build/day-decks.cjs → js/ft-day-decks-data.js)
        run: node build/day-decks.cjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1 jspdf@4.2.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      # 🎯 on a pull request, only the browser tests its change can affect (.github/scripts/affected.mjs: the tests that drive
      # what the changed files define, use or patch, and always the server requests test); every test on a push to main,
      # on Run workflow, and when the change touches what every page shares. They run 3 at a time, each on its own test
      # server (.github/scripts/smoke.mjs)
      - name: Pick the browser tests this change affects
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node .github/scripts/affected.mjs --why "${{ github.event.pull_request.base.sha }}"
            echo "tests=$(node .github/scripts/affected.mjs "${{ github.event.pull_request.base.sha }}" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          else
            echo "ALL (a push to main, or Run workflow)"; echo "tests=ALL" >> "$GITHUB_OUTPUT"
          fi
      - name: Run them (each on its own test server, 3 at a time)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          SMOKE_JOBS: 3
        run: node .github/scripts/smoke.mjs ${{ steps.pick.outputs.tests }}
