<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>LSH Knowledge Base</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{--bg:#EEF0F6;--ink:#1B1E2E;--navy:#262B45;--orange:#DB8437;--paper:#FFFFFF;--line:#DCE0EA;
  /* The gradients the flat colours are painted with, each keeping its flat colour as the middle stop. */
  --grad-navy:linear-gradient(135deg,#333A5E 0%,#262B45 52%,#1A1E33 100%);
  --grad-orange:linear-gradient(135deg,#EFA560 0%,#DB8437 50%,#C06E22 100%);
  --grad-orange-deep:linear-gradient(135deg,#CE7A2C 0%,#B5651F 52%,#954F13 100%);
  --grad-page:linear-gradient(160deg,#F5F7FC 0%,#EEF0F6 45%,#E3E7F2 100%);
  --grad-paper:linear-gradient(165deg,#FFFFFF 0%,#FDFDFF 55%,#F6F8FD 100%)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:var(--grad-page);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;min-height:100vh;position:relative}
/* The photo behind the page, at 35% (the rest is the page's own background showing through). */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:url("/img/kb-bg.webp") center/cover no-repeat;opacity:.35;pointer-events:none}
header{background:var(--navy);background-image:var(--grad-navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
header img{width:32px;height:32px;border-radius:6px}
header b{font-size:17px}
header a.back:first-of-type{margin-left:auto}
header a.back{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 12px;font-size:14px}
header a.back:hover{background:rgba(255,255,255,.12)}
main{flex:1;display:flex;flex-direction:column;padding:16px;gap:12px}
/* The note's gradient is translucent like the colour under it, so the photo still reads through. */
.note{background:rgba(255,255,255,.92);background-image:linear-gradient(165deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 55%,rgba(27,30,46,.05) 100%);border:1px solid var(--line);border-radius:12px;padding:16px 20px;max-width:640px;margin:24px auto;box-shadow:0 6px 24px rgba(27,30,46,.12)}
.note h1{margin:0 0 8px;font-size:20px}
/* The button's text is white, so it takes the deep orange: the light end of the plain
   orange gradient would leave it too faint to read. */
.btn{display:inline-block;background:var(--orange);background-image:var(--grad-orange-deep);color:#fff;text-decoration:none;font-weight:600;border-radius:8px;padding:9px 16px}
iframe{flex:1;width:100%;min-height:70vh;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.bar{display:flex;justify-content:flex-end}
.bar a{color:var(--navy);font-size:14px}
</style>
</head>
<body>
<header>
  <img src="/favicon.png" alt="">
  <b>LSH Knowledge Base</b>
  <a class="back" href="/glossary.html">📖 Legal Glossary</a>
  <a class="back" style="margin-left:0" href="/">← Foundational Training</a>
</header>
<main id="main"></main>
<script>
// The deployed LSH Knowledge Base (the lsh-knowledge-base Worker). Set this once it is deployed.
var KB_URL = "";

var main = document.getElementById("main");
if (/^https:\/\//.test(KB_URL)) {
  main.innerHTML = '<div class="bar"><a href="' + KB_URL + '" target="_blank" rel="noopener">Open in a new tab ↗</a></div>'
    + '<iframe src="' + KB_URL + '" title="LSH Knowledge Base" allow="fullscreen"></iframe>';
} else {
  main.innerHTML = '<div class="note"><h1>The Knowledge Base isn\'t connected yet</h1>'
    + '<p>This page will show the LSH Knowledge Base, the community library of SOPs, guides and training videos. '
    + 'It has not been deployed yet, so there is nothing to open. Ask an admin to set <code>KB_URL</code> in <code>kb.html</code>.</p>'
    + '<a class="btn" href="/">Back to Foundational Training</a></div>';
}
</script>
</body>
</html>
