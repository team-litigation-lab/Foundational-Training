<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>LSH Knowledge Base</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{--bg:#EEF0F6;--ink:#1B1E2E;--navy:#262B45;--orange:#DB8437;--paper:#FFFFFF;--line:#DCE0EA}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;min-height:100vh}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
header img{width:32px;height:32px;border-radius:6px}
header b{font-size:17px}
header a.back:first-of-type{margin-left:auto}
header a.back{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 12px;font-size:14px}
header a.back:hover{background:rgba(255,255,255,.12)}
main{flex:1;display:flex;flex-direction:column;padding:16px;gap:12px}
.note{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 20px;max-width:640px;margin:24px auto}
.note h1{margin:0 0 8px;font-size:20px}
.btn{display:inline-block;background:var(--orange);color:#fff;text-decoration:none;font-weight:600;border-radius:8px;padding:9px 16px}
iframe{flex:1;width:100%;min-height:70vh;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.bar{display:flex;justify-content:flex-end}
.bar a{color:var(--navy);font-size:14px}
</style>
</head>
<body>
<header>
  <img src="/favicon.png" alt="">
  <b>LSH Knowledge Base</b>
  <a class="back" href="/glossary.html">📖 Legal Glossary</a>
  <a class="back" style="margin-left:0" href="/">← Foundational Training</a>
</header>
<main id="main"></main>
<script>
// The deployed LSH Knowledge Base (the lsh-knowledge-base Worker). Set this once it is deployed.
var KB_URL = "";

var main = document.getElementById("main");
if (/^https:\/\//.test(KB_URL)) {
  main.innerHTML = '<div class="bar"><a href="' + KB_URL + '" target="_blank" rel="noopener">Open in a new tab ↗</a></div>'
    + '<iframe src="' + KB_URL + '" title="LSH Knowledge Base" allow="fullscreen"></iframe>';
} else {
  main.innerHTML = '<div class="note"><h1>The Knowledge Base isn\'t connected yet</h1>'
    + '<p>This page will show the LSH Knowledge Base, the community library of SOPs, guides and training videos. '
    + 'It has not been deployed yet, so there is nothing to open. Ask an admin to set <code>KB_URL</code> in <code>kb.html</code>.</p>'
    + '<a class="btn" href="/">Back to Foundational Training</a></div>';
}
</script>
</body>
</html>
