<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>LSH Knowledge Base</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{--bg:#EEF0F6;--ink:#1B1E2E;--navy:#262B45;--orange:#DB8437;--paper:#FFFFFF;--line:#DCE0EA;--muted:#5B6075}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
header img{width:32px;height:32px;border-radius:6px}
header b{font-size:17px}
header a.back{margin-left:auto;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 12px;font-size:14px}
header a.back:hover{background:rgba(255,255,255,.12)}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 14px}
#q{width:100%;padding:10px 12px;font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:22px 0 8px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:17px}
.card p{margin:0 0 8px;color:var(--muted);font-size:15px}
.tags span{display:inline-block;background:var(--bg);border-radius:20px;padding:1px 10px;font-size:12px;margin:0 4px 4px 0}
.btn{display:inline-block;background:var(--orange);color:#fff;text-decoration:none;font-weight:600;border-radius:8px;padding:6px 14px;font-size:14px;margin-right:6px}
.btn.alt{background:var(--navy)}
.meta{font-size:12px;color:var(--muted);margin-left:4px}
#viewer{position:fixed;inset:0;background:rgba(27,30,46,.7);display:none;flex-direction:column;padding:12px;z-index:5}
#viewer.on{display:flex}
#viewer .bar{display:flex;gap:8px;justify-content:space-between;align-items:center;color:#fff;padding:0 4px 8px}
#viewer button{background:var(--orange);color:#fff;border:0;border-radius:8px;padding:6px 14px;font:inherit;cursor:pointer}
#viewer iframe{flex:1;border:0;border-radius:10px;background:#fff}
</style>
</head>
<body>
<header>
  <img src="/favicon.png" alt="">
  <b>LSH Knowledge Base</b>
  <a class="back" href="/">← Foundational Training</a>
</header>
<main>
  <h1>Knowledge Base</h1>
  <p class="sub">SOPs, manuals and guides for the team. Search by title, topic or tag.</p>
  <input id="q" type="search" placeholder="Search the library…" aria-label="Search the library">
  <div id="list"></div>
</main>
<div id="viewer"><div class="bar"><span id="vt"></span><button id="vx">Close</button></div><iframe id="vf" title="Document"></iframe></div>
<script>
// Documents are listed in kb/docs.json. Add one with: python3 build/add_kb_doc.py <file> --title "…"
var docs = [];
var list = document.getElementById("list"), q = document.getElementById("q");

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function render(){
  var term = q.value.trim().toLowerCase(), groups = {}, n = 0;
  docs.forEach(function(d){
    var hay = [d.title, d.summary, d.section, (d.tags || []).join(" ")].join(" ").toLowerCase();
    if (term && !term.split(/\s+/).every(function(w){ return hay.indexOf(w) >= 0; })) return;
    (groups[d.section || "General"] = groups[d.section || "General"] || []).push(d); n++;
  });
  if (!n) { list.innerHTML = '<p class="sub">' + (docs.length ? "Nothing matches that search." : "No documents yet.") + "</p>"; return; }
  list.innerHTML = Object.keys(groups).sort().map(function(sec){
    return "<h2>" + esc(sec) + "</h2>" + groups[sec].map(function(d){
      var isPdf = /\.pdf$/i.test(d.file);
      return '<div class="card"><h3>' + esc(d.title) + "</h3>"
        + (d.summary ? "<p>" + esc(d.summary) + "</p>" : "")
        + '<div class="tags">' + (d.tags || []).map(function(t){ return "<span>" + esc(t) + "</span>"; }).join("") + "</div>"
        + (isPdf ? '<a class="btn" href="' + esc(d.file) + '" data-view="' + esc(d.file) + '" data-title="' + esc(d.title) + '">Read</a>' : "")
        + '<a class="btn alt" href="' + esc(d.file) + '" download>Download</a>'
        + '<span class="meta">Added ' + esc(d.added || "") + "</span></div>";
    }).join("");
  }).join("");
}

list.addEventListener("click", function(e){
  var a = e.target.closest("[data-view]"); if (!a) return;
  e.preventDefault();
  document.getElementById("vt").textContent = a.getAttribute("data-title");
  document.getElementById("vf").src = a.getAttribute("data-view");
  document.getElementById("viewer").classList.add("on");
});
document.getElementById("vx").onclick = function(){
  document.getElementById("viewer").classList.remove("on");
  document.getElementById("vf").src = "about:blank";
};
q.addEventListener("input", render);

fetch("kb/docs.json").then(function(r){ return r.json(); }).then(function(d){
  docs = d.sort(function(a, b){ return (b.added || "").localeCompare(a.added || ""); }); render();
}).catch(function(){ list.innerHTML = '<p class="sub">The library could not be loaded. Try again in a moment.</p>'; });
</script>
</body>
</html>
