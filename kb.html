<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>LSH Knowledge Base</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{
  /* Global typography: Inter first, then the native OS stack, so the UI renders sharp with
     no font download when Inter is unavailable. The same token on every LSH page. */
  --font-ui:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --bg:#EEF0F6;--ink:#1B1E2E;--navy:#262B45;--orange:#DB8437;--paper:#FFFFFF;--line:#DCE0EA;
  /* The gradients the flat colours are painted with, each keeping its flat colour as the middle stop. */
  --grad-navy:linear-gradient(135deg,#333A5E 0%,#262B45 52%,#1A1E33 100%);
  --grad-orange:linear-gradient(135deg,#EFA560 0%,#DB8437 50%,#C06E22 100%);
  --grad-orange-deep:linear-gradient(135deg,#CE7A2C 0%,#B5651F 52%,#954F13 100%);
  --grad-page:linear-gradient(160deg,#F5F7FC 0%,#EEF0F6 45%,#E3E7F2 100%);
  --grad-paper:linear-gradient(165deg,#FFFFFF 0%,#FDFDFF 55%,#F6F8FD 100%)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:var(--grad-page);color:var(--ink);font:16px/1.5 var(--font-ui);display:flex;flex-direction:column;min-height:100vh;position:relative}
/* The photo behind the page, at 35% (the rest is the page's own background showing through). */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:url("/img/kb-bg.webp") center/cover no-repeat;opacity:.35;pointer-events:none}
header{background:var(--navy);background-image:var(--grad-navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
header img{height:46px;width:auto;border-radius:6px;display:block}  /* the standard LSH logo, as on every LSH page */
header b{font-family:var(--font-ui);font-size:16px;font-weight:800;letter-spacing:.075em;text-transform:uppercase}
header a.back:first-of-type{margin-left:auto}
header a.back{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 12px;font-size:14px}
header a.back:hover{background:rgba(255,255,255,.12)}
main{flex:1;display:flex;flex-direction:column;padding:16px;gap:12px}

/* ---- The LSH standard page style (see the Portal's README) ----------------
   This page is outside the app shell in index.html, so it carries its own copy
   of the backdrop at the shared strength. The gradients and the lit edge are
   the same vocabulary as the app's.
   -------------------------------------------------------------------------- */
body::before{opacity:.40 !important;}
header{box-shadow:inset 0 -1px 0 rgba(56,189,248,.38),0 12px 30px -16px rgba(22,24,41,.65);}
@media print{body::before{display:none;}}
</style>
</head>
<body>
<header>
  <img src="/js/lsh-logo-dark.png" alt="Legal Support Help">
  <b>Knowledge Base</b>
  <a class="back" href="/glossary.html">📖 Legal Glossary</a>
  <a class="back" style="margin-left:0" href="/">↩ Back to my progress</a>
</header>
<main id="main"></main>
<script>
// Not in a frame: the Knowledge Base's session cookie is SameSite=Lax, so inside this page (another site) it is never set or
// sent and a frame only ever shows its sign-in screen. Opened from the Portal's launcher, it arrives signed in.
location.replace("https://cm-training-activity.pages.dev/api/launch?tool=kb");
</script>
</body>
</html>
